<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Fat Dev</title>

	<style>
		.lava-bg {
			position: fixed;
			inset: 0;
			overflow: hidden;
			background:
				radial-gradient(circle at 50% 50%, rgba(255, 197, 54, .18), transparent 24%),
				linear-gradient(135deg, #090014 0%, #1a0738 34%, #250021 64%, #05000d 100%);
			isolation: isolate;
		}

		.lava-bg::before,
		.lava-bg::after {
			content: "";
			position: absolute;
			inset: -35vmax;
			background:
				radial-gradient(circle at 18% 28%, #ff3fcf 0 7%, transparent 15%),
				radial-gradient(circle at 78% 24%, #18f4ff 0 8%, transparent 17%),
				radial-gradient(circle at 52% 18%, #fff35d 0 6%, transparent 15%),
				radial-gradient(circle at 28% 76%, #ff8a1d 0 9%, transparent 18%),
				radial-gradient(circle at 72% 72%, #8f3cff 0 10%, transparent 21%),
				radial-gradient(circle at 48% 54%, #7cff4a 0 7%, transparent 16%),
				radial-gradient(circle at 12% 58%, #ff2f74 0 8%, transparent 19%),
				radial-gradient(circle at 88% 52%, #ffc52e 0 7%, transparent 17%);
			filter: blur(44px) saturate(1.9) contrast(1.16);
			mix-blend-mode: screen;
			opacity: .86;
			animation: lava-flow-a 32s cubic-bezier(.45, 0, .55, 1) infinite;
			will-change: transform, filter;
		}

		.lava-bg::after {
			inset: -45vmax;
			background:
				radial-gradient(circle at 22% 18%, #24f6ff 0 7%, transparent 17%),
				radial-gradient(circle at 68% 22%, #ff4fe1 0 9%, transparent 20%),
				radial-gradient(circle at 42% 44%, #ffb02e 0 11%, transparent 23%),
				radial-gradient(circle at 82% 62%, #7fff4d 0 8%, transparent 18%),
				radial-gradient(circle at 20% 82%, #9b42ff 0 10%, transparent 22%),
				radial-gradient(circle at 58% 84%, #ff385f 0 8%, transparent 19%);
			filter: blur(58px) saturate(2.05) contrast(1.22);
			opacity: .62;
			animation: lava-flow-b 48s cubic-bezier(.45, 0, .55, 1) infinite;
		}

		.blob {
			position: absolute;
			width: 34vmax;
			height: 34vmax;
			left: 50%;
			top: 50%;
			border-radius: 42% 58% 61% 39% / 45% 39% 61% 55%;
			background:
				radial-gradient(circle at 34% 30%, rgba(255, 255, 255, .72), transparent 8%),
				radial-gradient(circle at 50% 50%, rgba(255, 244, 92, .95), rgba(255, 47, 214, .72) 42%, rgba(36, 246, 255, .36) 68%, transparent 72%);
			filter: blur(28px) saturate(2);
			mix-blend-mode: screen;
			opacity: .58;
			transform: translate(-50%, -50%);
			animation: blob-loop 40s cubic-bezier(.45, 0, .55, 1) infinite;
			will-change: transform, border-radius;
		}

		.blob:nth-child(2) {
			width: 28vmax;
			height: 28vmax;
			animation-delay: -10s;
			animation-duration: 44s;
			background:
				radial-gradient(circle at 40% 32%, rgba(255, 255, 255, .6), transparent 9%),
				radial-gradient(circle at 50% 50%, rgba(36, 246, 255, .9), rgba(143, 60, 255, .72) 45%, rgba(255, 138, 29, .36) 70%, transparent 74%);
		}

		.blob:nth-child(3) {
			width: 42vmax;
			height: 42vmax;
			animation-delay: -20s;
			animation-duration: 52s;
			opacity: .44;
			background:
				radial-gradient(circle at 38% 34%, rgba(255, 255, 255, .58), transparent 8%),
				radial-gradient(circle at 50% 50%, rgba(255, 47, 116, .92), rgba(124, 255, 74, .56) 48%, rgba(255, 197, 46, .36) 72%, transparent 76%);
		}

		.blob:nth-child(4) {
			width: 24vmax;
			height: 24vmax;
			animation-delay: -30s;
			animation-duration: 36s;
			opacity: .7;
			background:
				radial-gradient(circle at 36% 30%, rgba(255, 255, 255, .65), transparent 8%),
				radial-gradient(circle at 50% 50%, rgba(255, 138, 29, .95), rgba(255, 63, 207, .64) 45%, rgba(36, 246, 255, .36) 70%, transparent 74%);
		}

		.grain {
			position: absolute;
			inset: 0;
			opacity: .12;
			mix-blend-mode: overlay;
			background-image:
				repeating-radial-gradient(circle at 17% 23%, rgba(255, 255, 255, .5) 0 1px, transparent 1px 4px),
				repeating-linear-gradient(90deg, rgba(255, 255, 255, .08) 0 1px, transparent 1px 5px);
			animation: grain-loop 8s steps(8) infinite;
		}

		@keyframes lava-flow-a {
			0% {
				transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
				filter: blur(44px) saturate(1.9) contrast(1.16) hue-rotate(0deg);
			}

			50% {
				transform: translate3d(0, -10vmax, 0) rotate(0deg) scale(1.15);
				filter: blur(44px) saturate(1.9) contrast(1.16) hue-rotate(180deg);
			}

			100% {
				transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
				filter: blur(44px) saturate(1.9) contrast(1.16) hue-rotate(360deg);
			}
		}

		@keyframes lava-flow-b {
			0% {
				transform: translate3d(0, 0, 0) rotate(0deg) scale(1.08);
				filter: blur(58px) saturate(2.05) contrast(1.22) hue-rotate(0deg);
			}

			50% {
				transform: translate3d(0, 12vmax, 0) rotate(0deg) scale(1.04);
				filter: blur(58px) saturate(2.05) contrast(1.22) hue-rotate(180deg);
			}

			100% {
				transform: translate3d(0, 0, 0) rotate(0deg) scale(1.08);
				filter: blur(58px) saturate(2.05) contrast(1.22) hue-rotate(360deg);
			}
		}

		@keyframes blob-loop {
			0% {
				transform: translate(-50%, -50%) translate(-20vw, -20vh) scale(1);
				border-radius: 42% 58% 61% 39% / 45% 39% 61% 55%;
			}

			50% {
				transform: translate(-50%, -50%) translate(20vw, 20vh) scale(1.1);
				border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
			}

			100% {
				transform: translate(-50%, -50%) translate(-20vw, -20vh) scale(1);
				border-radius: 42% 58% 61% 39% / 45% 39% 61% 55%;
			}
		}

		@keyframes grain-loop {

			0%,
			100% {
				transform: translate(0, 0);
			}

			25% {
				transform: translate(-1%, 1%);
			}

			50% {
				transform: translate(1%, -1%);
			}

			75% {
				transform: translate(1%, 1%);
			}
		}

		@media (prefers-reduced-motion: reduce) {

			.lava-bg::before,
			.lava-bg::after,
			.blob,
			.grain {
				animation: none;
			}
		}

		@keyframes hypnotize {
			0% {
				transform: rotate(0deg) scale(1);
				-webkit-filter: hue-rotate(0deg);
			}

			25% {
				transform: rotate(90deg) scale(2);
				-webkit-filter: hue-rotate(360deg);
			}

			50% {
				transform: rotate(180deg) scale(1);
				-webkit-filter: hue-rotate(0deg);
			}

			75% {
				transform: rotate(270deg) scale(2);
				-webkit-filter: hue-rotate(360deg);
			}

			100% {
				transform: rotate(360deg) scale(1);
				-webkit-filter: hue-rotate(0deg);
			}
		}

		#container {
			position: fixed;
			left: 0;
			right: 0;
			top: 0;
			bottom: 0;
			overflow: hidden;
		}

		.monkeys {
			position: absolute;
			left: 50%;
			top: 50%;
			margin: -1500px 0 0 -1500px;
			height: 3000px;
			width: 3000px;
			background-image: url('./monkey.png	');
			background-repeat: repeat;
			background-size: 100px 100px;
			animation: hypnotize 20s linear infinite;
			opacity: 0.4;

		}

		.monkeys:nth-child(2) {
			animation-duration: 30s;
			opacity: 0.2;
		}

		.monkeys:nth-child(3) {
			animation-duration: 40s;
			opacity: 0.1;
		}
	</style>
</head>

<body>
	<div class="lava-bg" aria-hidden="true">
		<div class="blob"></div>
		<div class="blob"></div>
		<div class="blob"></div>
		<div class="blob"></div>
		<div class="grain"></div>
	</div>
	<div id="container">
		<div class="monkeys"></div>
		<div class="monkeys"></div>
		<div class="monkeys"></div>
	</div>
</body>

</html>
